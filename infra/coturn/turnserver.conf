# coturn config for RandChat — TURN relay fallback server.
# Place at: infra/coturn/turnserver.conf

# ─── Network ────────────────────────────────────────────────────────────
# Listen on all interfaces.
listening-ip=0.0.0.0

# TURN/STUN port (default 3478).
listening-port=3478

# TURNS (TURN over TLS) port (default 5349).
tls-listening-port=5349

# Relay port range (must match docker-compose port mapping).
min-port=49152
max-port=49200

# ─── Authentication ───────────────────────────────────────────────────────
# Use long-term credential mechanism (HMAC-SHA1).
# The static auth secret is shared with the API server (TURN_STATIC_AUTH_SECRET).
# The API generates per-call credentials: username = "expiry:userId", credential = HMAC-SHA1(secret, username).
use-auth-secret
static-auth-secret=CHANGE_ME_TO_MATCH_TURN_STATIC_AUTH_SECRET

# ─── TLS ─────────────────────────────────────────────────────────────────
# Self-signed cert for dev; replace with Let's Encrypt in production.
cert=/etc/turn_server_cert.pem
pkey=/etc/turn_server_pkey.pem

# ─── Security ────────────────────────────────────────────────────────────
# Disable CLI.
no-cli

# No multicast peers.
no-multicast-peers

# Reject relay traffic to private addresses (prevent abuse).
no-loopback-peers
no-multicast-peers

# ─── Logging ────────────────────────────────────────────────────────────
log-file=/var/log/turnserver.log
simple-log
